services:
  db:
    image: supabase/postgres:17.12.0.005
    environment:
      POSTGRES_PASSWORD: postgres # local only, not a secret
    ports: ["54322:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 2s
      retries: 30
  api:
    profiles: ["app"]
    build: ./apps/api
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      # Local GoTrue behind the gateway (profile `auth`). With profile `app` alone this host does not
      # resolve: the API still starts and rejects every token.
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-http://auth-gateway/auth/v1/.well-known/jwks.json}
  # Local Supabase Auth (PRD D-71): GoTrue on our database, behind an nginx gateway that serves the
  # same /auth/v1 paths as a hosted project, with Mailpit catching the confirmation and reset mails.
  # Start with `make up`. Every password and key below is local only, not a secret.
  auth:
    profiles: ["auth"]
    image: supabase/auth:v2.199.0
    depends_on: { db: { condition: service_healthy } }
    # GOTRUE_JWT_KEYS takes the JSON array of private JWKs; compose cannot read a file into a variable.
    command: ["sh", "-c", 'GOTRUE_JWT_KEYS="$$(cat /run/auth/jwt-keys.json)" exec auth']
    volumes: ["./.cache/auth/jwt-keys.json:/run/auth/jwt-keys.json:ro"] # written by `make auth-keys`
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres?search_path=auth # local only, not a secret
      GOTRUE_SITE_URL: io.github.example.leantracker://auth-callback
      GOTRUE_URI_ALLOW_LIST: io.github.example.leantracker://auth-callback
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: local-only-not-a-secret-never-used-to-sign # required by GoTrue; tokens are signed with GOTRUE_JWT_KEYS (ES256)
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@localhost
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9999/health"]
      interval: 2s
      retries: 30
  auth-gateway:
    profiles: ["auth"]
    image: nginx:1.30.8-alpine
    depends_on: { auth: { condition: service_healthy } }
    volumes: ["./local/auth-gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54321:80"]
  mailpit:
    profiles: ["auth"]
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:8025:8025"] # web UI; SMTP (1025) stays inside the compose network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
