# Local stand-in for the hosted Supabase gateway: supabase_flutter calls <SUPABASE_URL>/auth/v1/...
# and the API reads <SUPABASE_URL>/auth/v1/.well-known/jwks.json, so local and hosted paths match.
server {
    listen 80;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
