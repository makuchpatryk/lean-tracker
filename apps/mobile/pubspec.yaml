name: lean_tracker
description: "Lean Tracker mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  swagger_parser: ^1.46.0
  retrofit_generator: ^10.3.3
  json_serializable: ^6.15.2
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  generate: true # gen-l10n from l10n.yaml (make gen-dart)
  fonts:
    # Variable font (googlefonts/nunito ships no static TTFs): the weight comes from FontVariation('wght'), see lib/ui/.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

# Dart client generated from apps/mobile/openapi.yaml, the committed copy of the API contract (make sync-contract): make gen-dart. Output is committed and never edited.
swagger_parser:
  schema_path: openapi.yaml
  output_directory: lib/gen
  language: dart
  json_serializer: json_serializable
