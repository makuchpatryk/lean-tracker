name: lean_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  swagger_parser: ^1.46.0
  retrofit_generator: ^10.3.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

# Dart client generated from the OpenAPI contract: `make gen-dart`. Output is committed and never edited.
swagger_parser:
  schema_path: ../../contracts/openapi/openapi.yaml
  output_directory: lib/gen
  language: dart
  json_serializer: json_serializable
